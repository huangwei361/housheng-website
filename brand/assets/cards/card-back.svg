<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 900" width="540" height="900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#e6f3f1"/>
    </linearGradient>
  </defs>

  <rect width="540" height="900" fill="url(#bg2)"/>

  <!-- 装饰圆 -->
  <circle cx="490" cy="100" r="80" fill="#006d77" opacity="0.06"/>
  <circle cx="50" cy="800" r="120" fill="#006d77" opacity="0.05"/>

  <!-- Logo -->
  <g transform="translate(195, 100)">
    <circle cx="75" cy="75" r="75" fill="#006d77"/>
    <text x="75" y="95" font-family="serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-3">厚</text>
  </g>

  <text x="270" y="280" font-family="serif" font-size="36" font-weight="700" fill="#006d77" text-anchor="middle" letter-spacing="6">厚生 HOUSHENG</text>
  <text x="270" y="320" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="2">CHINESE WELLNESS · SINCE 2026</text>

  <!-- 分隔线 -->
  <line x1="170" y1="360" x2="370" y2="360" stroke="#c0392b" stroke-width="1.5"/>

  <!-- 6 大业务 -->
  <g font-family="sans-serif" font-size="13" fill="#1a1a1a">
    <text x="80" y="420" font-weight="600" fill="#006d77">🩺 公共营养学</text>
    <text x="80" y="450" font-weight="600" fill="#006d77">🏃 运动健康</text>
    <text x="80" y="480" font-weight="600" fill="#006d77">🧘 传统功法</text>
    <text x="300" y="420" font-weight="600" fill="#006d77">🌿 中医理疗</text>
    <text x="300" y="450" font-weight="600" fill="#006d77">💚 心理咨询</text>
    <text x="300" y="480" font-weight="600" fill="#006d77">📋 健康检测</text>
  </g>

  <!-- 二维码占位 -->
  <g transform="translate(170, 540)">
    <rect width="200" height="200" fill="#ffffff" stroke="#006d77" stroke-width="2" rx="8"/>
    <!-- 简化二维码 -->
    <g transform="translate(15, 15)" fill="#1a1a1a">
      <rect x="0" y="0" width="40" height="40"/>
      <rect x="6" y="6" width="28" height="28" fill="#ffffff"/>
      <rect x="14" y="14" width="12" height="12"/>

      <rect x="130" y="0" width="40" height="40"/>
      <rect x="136" y="6" width="28" height="28" fill="#ffffff"/>
      <rect x="144" y="14" width="12" height="12"/>

      <rect x="0" y="130" width="40" height="40"/>
      <rect x="6" y="136" width="28" height="28" fill="#ffffff"/>
      <rect x="14" y="144" width="12" height="12"/>

      <!-- 数据点 -->
      <rect x="50" y="10" width="8" height="8"/>
      <rect x="70" y="20" width="8" height="8"/>
      <rect x="60" y="40" width="8" height="8"/>
      <rect x="80" y="50" width="8" height="8"/>
      <rect x="100" y="40" width="8" height="8"/>
      <rect x="120" y="50" width="8" height="8"/>
      <rect x="50" y="70" width="8" height="8"/>
      <rect x="70" y="80" width="8" height="8"/>
      <rect x="90" y="90" width="8" height="8"/>
      <rect x="110" y="80" width="8" height="8"/>
      <rect x="60" y="100" width="8" height="8"/>
      <rect x="80" y="110" width="8" height="8"/>
      <rect x="100" y="120" width="8" height="8"/>
      <rect x="120" y="110" width="8" height="8"/>
      <rect x="50" y="130" width="8" height="8"/>
      <rect x="70" y="150" width="8" height="8"/>
      <rect x="90" y="160" width="8" height="8"/>
      <rect x="110" y="150" width="8" height="8"/>
      <rect x="60" y="170" width="8" height="8"/>
      <rect x="130" y="60" width="8" height="8"/>
      <rect x="150" y="80" width="8" height="8"/>
      <rect x="130" y="100" width="8" height="8"/>
      <rect x="160" y="110" width="8" height="8"/>
      <rect x="140" y="130" width="8" height="8"/>
      <rect x="160" y="150" width="8" height="8"/>
      <rect x="150" y="170" width="8" height="8"/>
    </g>
    <!-- 中心 logo -->
    <rect x="80" y="80" width="40" height="40" fill="#ffffff" stroke="#006d77" stroke-width="2" rx="4"/>
    <text x="100" y="106" font-family="serif" font-size="20" font-weight="900" fill="#006d77" text-anchor="middle">厚</text>
  </g>

  <text x="270" y="780" font-family="sans-serif" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">扫码关注厚生</text>
  <text x="270" y="800" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">公众号 · 小程序 · 客服</text>

  <!-- 底部品牌行 -->
  <line x1="100" y1="850" x2="440" y2="850" stroke="#c0392b" stroke-width="0.5" opacity="0.4"/>
  <text x="270" y="875" font-family="serif" font-size="14" fill="#006d77" text-anchor="middle" letter-spacing="3">厚生万物 · 养心养身</text>
</svg>

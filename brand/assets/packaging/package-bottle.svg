<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700">
  <defs>
    <linearGradient id="bottleBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006d77"/>
      <stop offset="50%" stop-color="#0a4f48"/>
      <stop offset="100%" stop-color="#003c39"/>
    </linearGradient>
    <linearGradient id="bottleNeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#e6f3f1"/>
    </linearGradient>
  </defs>

  <!-- 瓶盖 -->
  <rect x="150" y="50" width="100" height="80" fill="url(#cap)" rx="4"/>
  <rect x="150" y="50" width="100" height="6" fill="#a52d24" opacity="0.5"/>
  <line x1="160" y1="80" x2="240" y2="80" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <line x1="160" y1="100" x2="240" y2="100" stroke="#fff" stroke-width="0.5" opacity="0.3"/>

  <!-- 瓶颈 -->
  <rect x="160" y="130" width="80" height="60" fill="url(#bottleNeck)"/>
  <rect x="160" y="130" width="6" height="60" fill="#ffffff" opacity="0.2"/>

  <!-- 瓶身 -->
  <path d="M155 190 L245 190 L255 220 L255 600 Q255 640 200 640 Q145 640 145 600 L145 220 Z" fill="url(#bottleBody)"/>
  <!-- 高光 -->
  <path d="M160 200 L165 200 L165 620 L160 620 Z" fill="#ffffff" opacity="0.2"/>
  <path d="M240 200 L235 200 L235 620 L240 620 Z" fill="#000000" opacity="0.2"/>

  <!-- 标签 -->
  <rect x="155" y="280" width="90" height="280" fill="url(#label)"/>

  <!-- 标签顶部 logo 条 -->
  <rect x="155" y="280" width="90" height="50" fill="#006d77"/>
  <g transform="translate(170, 285)">
    <circle cx="12" cy="12" r="12" fill="#ffffff"/>
    <text x="12" y="17" font-family="serif" font-size="14" font-weight="900" fill="#006d77" text-anchor="middle">厚</text>
  </g>
  <text x="200" y="305" font-family="serif" font-size="11" font-weight="700" fill="#ffffff">厚生</text>
  <text x="200" y="320" font-family="sans-serif" font-size="6" fill="#f77f00">HOUSHENG</text>

  <!-- 产品名 -->
  <text x="200" y="360" font-family="serif" font-size="16" font-weight="700" fill="#006d77" text-anchor="middle">维生素</text>
  <text x="200" y="382" font-family="serif" font-size="16" font-weight="700" fill="#006d77" text-anchor="middle">D3 + K2</text>

  <line x1="170" y1="400" x2="230" y2="400" stroke="#c0392b" stroke-width="0.5"/>

  <!-- 规格 -->
  <text x="200" y="425" font-family="sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">5000IU · MK-7</text>
  <text x="200" y="442" font-family="sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">90 粒 / 瓶</text>

  <!-- 蓝帽子 -->
  <g transform="translate(180, 460)">
    <rect width="40" height="20" fill="#ffffff" stroke="#006d77" stroke-width="0.5" rx="2"/>
    <text x="20" y="9" font-family="sans-serif" font-size="5" fill="#006d77" text-anchor="middle">国食健字</text>
    <text x="20" y="15" font-family="sans-serif" font-size="4" fill="#006d77" text-anchor="middle">G2020XXXX</text>
  </g>

  <!-- 卖点 -->
  <text x="200" y="500" font-family="serif" font-size="7" fill="#1a1a1a" text-anchor="middle">✓ 骨骼免疫双补</text>
  <text x="200" y="515" font-family="serif" font-size="7" fill="#1a1a1a" text-anchor="middle">✓ 0 防腐剂</text>
  <text x="200" y="530" font-family="serif" font-size="7" fill="#1a1a1a" text-anchor="middle">✓ 90 天用量</text>

  <!-- 底部条形码 -->
  <g transform="translate(170, 540)">
    <rect x="0" y="0" width="2" height="12" fill="#1a1a1a"/>
    <rect x="4" y="0" width="1" height="12" fill="#1a1a1a"/>
    <rect x="7" y="0" width="3" height="12" fill="#1a1a1a"/>
    <rect x="12" y="0" width="1" height="12" fill="#1a1a1a"/>
    <rect x="15" y="0" width="2" height="12" fill="#1a1a1a"/>
    <rect x="19" y="0" width="1" height="12" fill="#1a1a1a"/>
    <rect x="22" y="0" width="3" height="12" fill="#1a1a1a"/>
    <rect x="27" y="0" width="1" height="12" fill="#1a1a1a"/>
    <rect x="30" y="0" width="2" height="12" fill="#1a1a1a"/>
    <rect x="34" y="0" width="3" height="12" fill="#1a1a1a"/>
    <rect x="39" y="0" width="1" height="12" fill="#1a1a1a"/>
    <rect x="42" y="0" width="2" height="12" fill="#1a1a1a"/>
    <rect x="46" y="0" width="1" height="12" fill="#1a1a1a"/>
    <rect x="49" y="0" width="3" height="12" fill="#1a1a1a"/>
    <rect x="54" y="0" width="2" height="12" fill="#1a1a1a"/>
    <text x="30" y="22" font-family="sans-serif" font-size="5" fill="#1a1a1a" text-anchor="middle">6 901234 567890</text>
  </g>
</svg>

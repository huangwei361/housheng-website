<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="boxBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006d77"/>
      <stop offset="50%" stop-color="#1a5d52"/>
      <stop offset="100%" stop-color="#0a3d36"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3d36"/>
      <stop offset="100%" stop-color="#1a5d52"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="50%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- 礼盒盖 -->
  <rect x="100" y="240" width="400" height="80" fill="url(#boxLid)" rx="4"/>
  <rect x="100" y="240" width="400" height="6" fill="#0a3d36" rx="2"/>

  <!-- 礼盒主体 -->
  <rect x="100" y="320" width="400" height="430" fill="url(#boxBody)" rx="6"/>

  <!-- 金色边线 -->
  <rect x="100" y="240" width="400" height="510" fill="none" stroke="#f77f00" stroke-width="1.5" opacity="0.4" rx="6"/>

  <!-- 高光 -->
  <rect x="100" y="400" width="400" height="2" fill="#ffffff" opacity="0.1"/>
  <rect x="100" y="700" width="400" height="2" fill="#000000" opacity="0.3"/>

  <!-- 礼盒盖文字 -->
  <text x="300" y="290" font-family="serif" font-size="20" font-weight="700" fill="#f77f00" text-anchor="middle" letter-spacing="3">厚生 · 营养礼盒</text>

  <!-- 顶部 logo 圆 -->
  <g transform="translate(260, 80)">
    <circle cx="40" cy="40" r="40" fill="#ffffff"/>
    <text x="40" y="52" font-family="serif" font-size="40" font-weight="900" fill="#006d77" text-anchor="middle" letter-spacing="-2">厚</text>
  </g>

  <!-- 礼盒正面 logo (大) -->
  <g transform="translate(260, 360)">
    <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95"/>
    <text x="40" y="52" font-family="serif" font-size="40" font-weight="900" fill="#006d77" text-anchor="middle" letter-spacing="-2">厚</text>
  </g>

  <!-- 主标题 -->
  <text x="300" y="490" font-family="serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">厚生</text>
  <text x="300" y="525" font-family="sans-serif" font-size="14" fill="#f77f00" text-anchor="middle" letter-spacing="4">HOUSHENG</text>

  <line x1="200" y1="555" x2="400" y2="555" stroke="#f77f00" stroke-width="1" opacity="0.6"/>

  <text x="300" y="590" font-family="serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">厚生万物 · 养心养身</text>
  <text x="300" y="615" font-family="sans-serif" font-size="11" fill="#b0d4d0" text-anchor="middle" letter-spacing="2">FOR LIFE · FOR WELLNESS</text>

  <!-- 产品列表 -->
  <g transform="translate(140, 650)">
    <rect width="320" height="80" fill="#ffffff" opacity="0.08" rx="4"/>
    <text x="160" y="25" font-family="serif" font-size="13" fill="#b0d4d0" text-anchor="middle" letter-spacing="2">内含 D3+K2 · 复合 B · Omega-3</text>
    <text x="160" y="48" font-family="serif" font-size="13" fill="#b0d4d0" text-anchor="middle" letter-spacing="2">3 大基础营养 · 90 天用量</text>
    <text x="160" y="70" font-family="serif" font-size="11" fill="#f77f00" text-anchor="middle" letter-spacing="2">📞 13971691656</text>
  </g>

  <!-- 水平缎带 (上下环绕) -->
  <rect x="100" y="430" width="400" height="22" fill="url(#ribbon)"/>
  <rect x="100" y="430" width="400" height="3" fill="#a52d24" opacity="0.6"/>
  <rect x="100" y="449" width="400" height="3" fill="#000" opacity="0.3"/>
  <!-- 缎带文字 -->
  <text x="300" y="446" font-family="serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">PREMIUM NUTRITION GIFT BOX</text>

  <!-- 顶部蝴蝶结 -->
  <g transform="translate(300, 280)">
    <ellipse cx="-30" cy="0" rx="30" ry="20" fill="#c0392b"/>
    <ellipse cx="30" cy="0" rx="30" ry="20" fill="#c0392b"/>
    <ellipse cx="-30" cy="0" rx="14" ry="9" fill="#e74c3c"/>
    <ellipse cx="30" cy="0" rx="14" ry="9" fill="#e74c3c"/>
    <rect x="-10" y="-10" width="20" height="20" fill="#c0392b" rx="2"/>
    <rect x="-7" y="-7" width="14" height="14" fill="#e74c3c" rx="1"/>
  </g>
  <!-- 飘带 -->
  <path d="M270 290 Q240 320 250 360 L260 320" fill="#c0392b"/>
  <path d="M330 290 Q360 320 350 360 L340 320" fill="#c0392b"/>
</svg>

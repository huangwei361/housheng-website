<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bagBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#e6f3f1"/>
    </linearGradient>
    <linearGradient id="bagTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006d77"/>
      <stop offset="100%" stop-color="#1a5d52"/>
    </linearGradient>
  </defs>

  <!-- 袋主体 (枕形) -->
  <path d="M50 130 L350 130 L360 160 L360 540 Q360 580 320 580 L80 580 Q40 580 40 540 L40 160 Z" fill="url(#bagBody)" stroke="#cbd5d3" stroke-width="0.5"/>

  <!-- 顶部封口 -->
  <path d="M40 130 L360 130 L360 100 Q360 80 340 80 L60 80 Q40 80 40 100 Z" fill="url(#bagTop)"/>
  <line x1="50" y1="130" x2="350" y2="130" stroke="#003c39" stroke-width="2"/>

  <!-- 封口齿 -->
  <g fill="#0a3d36">
    <rect x="60" y="90" width="6" height="20" rx="1"/>
    <rect x="80" y="90" width="6" height="20" rx="1"/>
    <rect x="100" y="90" width="6" height="20" rx="1"/>
    <rect x="120" y="90" width="6" height="20" rx="1"/>
    <rect x="140" y="90" width="6" height="20" rx="1"/>
    <rect x="160" y="90" width="6" height="20" rx="1"/>
    <rect x="180" y="90" width="6" height="20" rx="1"/>
    <rect x="200" y="90" width="6" height="20" rx="1"/>
    <rect x="220" y="90" width="6" height="20" rx="1"/>
    <rect x="240" y="90" width="6" height="20" rx="1"/>
    <rect x="260" y="90" width="6" height="20" rx="1"/>
    <rect x="280" y="90" width="6" height="20" rx="1"/>
    <rect x="300" y="90" width="6" height="20" rx="1"/>
    <rect x="320" y="90" width="6" height="20" rx="1"/>
  </g>

  <!-- 顶部 logo 条 -->
  <g transform="translate(150, 145)">
    <circle cx="20" cy="20" r="20" fill="#006d77"/>
    <text x="20" y="28" font-family="serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">厚</text>
  </g>
  <text x="200" y="170" font-family="serif" font-size="20" font-weight="700" fill="#006d77" letter-spacing="4">厚生</text>
  <text x="200" y="186" font-family="sans-serif" font-size="8" fill="#f77f00" letter-spacing="2">HOUSHENG</text>

  <line x1="100" y1="220" x2="300" y2="220" stroke="#c0392b" stroke-width="1"/>

  <!-- 主产品名 -->
  <text x="200" y="270" font-family="serif" font-size="28" font-weight="700" fill="#006d77" text-anchor="middle" letter-spacing="3">酸枣仁</text>
  <text x="200" y="305" font-family="serif" font-size="22" font-weight="700" fill="#006d77" text-anchor="middle" letter-spacing="3">+ 茶氨酸</text>

  <text x="200" y="345" font-family="serif" font-size="14" fill="#1a5d52" text-anchor="middle" letter-spacing="2">温和助眠 · 药食同源</text>

  <!-- 信息块 -->
  <rect x="80" y="380" width="240" height="60" fill="#ffffff" stroke="#006d77" stroke-width="1" rx="4"/>
  <text x="200" y="402" font-family="serif" font-size="12" fill="#1a1a1a" text-anchor="middle">📋 30 袋 / 盒 · 2g / 袋</text>
  <text x="200" y="420" font-family="serif" font-size="12" fill="#1a1a1a" text-anchor="middle">🌙 睡前 30 分钟温水冲服</text>
  <text x="200" y="435" font-family="serif" font-size="11" fill="#c0392b" text-anchor="middle">✓ 无褪黑素 · 无依赖</text>

  <!-- 蓝帽子 -->
  <g transform="translate(140, 460)">
    <rect width="120" height="22" fill="#006d77" rx="2"/>
    <text x="60" y="11" font-family="sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">蓝帽子保健食品</text>
    <text x="60" y="20" font-family="sans-serif" font-size="6" fill="#b0d4d0" text-anchor="middle">国食健字 G2020XXXX</text>
  </g>

  <!-- 底部 -->
  <text x="200" y="520" font-family="serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="3">厚生万物 · 养心养身</text>
  <text x="200" y="540" font-family="sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle" letter-spacing="2">FOR LIFE · FOR WELLNESS</text>
  <text x="200" y="560" font-family="sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">📞 13971691656 · 武汉·青山</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="lbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#e6f3f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 灯箱外壳 -->
  <rect x="10" y="10" width="580" height="780" fill="#1a1a1a" rx="20"/>
  <rect x="20" y="20" width="560" height="760" fill="url(#lbBg)" rx="14"/>
  <rect x="20" y="20" width="560" height="760" fill="url(#glow)" rx="14"/>

  <!-- 顶部装饰条 -->
  <rect x="20" y="20" width="560" height="80" fill="#006d77" rx="14"/>
  <rect x="20" y="80" width="560" height="20" fill="#006d77"/>
  <text x="300" y="75" font-family="serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="6">厚生 HOUSHENG</text>

  <!-- Logo 圆 -->
  <g transform="translate(230, 140)">
    <circle cx="70" cy="70" r="70" fill="#006d77"/>
    <text x="70" y="90" font-family="serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-3">厚</text>
  </g>

  <!-- 主标语 -->
  <text x="300" y="350" font-family="serif" font-size="48" font-weight="700" fill="#006d77" text-anchor="middle" letter-spacing="8">厚生万物</text>
  <text x="300" y="410" font-family="serif" font-size="48" font-weight="700" fill="#006d77" text-anchor="middle" letter-spacing="8">养心养身</text>

  <line x1="200" y1="450" x2="400" y2="450" stroke="#c0392b" stroke-width="2"/>

  <!-- 服务列表 -->
  <g font-family="serif" font-size="18" fill="#1a1a1a" text-anchor="middle">
    <text x="300" y="500">🩺 公共营养  ·  运动健康</text>
    <text x="300" y="535">🧘 传统功法  ·  中医理疗</text>
    <text x="300" y="570">💚 心理咨询  ·  健康检测</text>
  </g>

  <!-- 底部信息 -->
  <rect x="20" y="660" width="560" height="120" fill="#006d77" rx="0"/>
  <rect x="20" y="660" width="560" height="120" fill="url(#lbBg)" rx="0" opacity="0"/>

  <text x="300" y="700" font-family="serif" font-size="20" font-weight="700" fill="#006d77" text-anchor="middle" letter-spacing="3">FOR LIFE · FOR WELLNESS</text>
  <text x="300" y="740" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">📞 13971691656</text>
  <text x="300" y="762" font-family="sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">📍 武汉·青山旗舰店</text>

  <!-- 灯箱底部阴影 -->
  <rect x="0" y="790" width="600" height="10" fill="#000" opacity="0.2"/>
</svg>

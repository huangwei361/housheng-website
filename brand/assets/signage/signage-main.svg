<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="signBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5d52"/>
      <stop offset="100%" stop-color="#006d77"/>
    </linearGradient>
    <linearGradient id="signGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#e29578"/>
    </linearGradient>
  </defs>

  <!-- 招牌背景 -->
  <rect width="1600" height="500" fill="url(#signBg)"/>

  <!-- 装饰 -->
  <path d="M0 0 L1600 0 L1600 60 L0 100 Z" fill="#0a3d36" opacity="0.5"/>
  <path d="M0 500 L1600 500 L1600 440 L0 400 Z" fill="#0a3d36" opacity="0.5"/>
  <circle cx="100" cy="250" r="80" fill="#ffffff" opacity="0.04"/>
  <circle cx="1500" cy="250" r="120" fill="#ffffff" opacity="0.04"/>
  <line x1="0" y1="120" x2="1600" y2="120" stroke="url(#signGold)" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="380" x2="1600" y2="380" stroke="url(#signGold)" stroke-width="2" opacity="0.7"/>

  <!-- 左侧 logo -->
  <g transform="translate(150, 130)">
    <circle cx="120" cy="120" r="120" fill="#ffffff"/>
    <circle cx="120" cy="120" r="100" fill="none" stroke="#006d77" stroke-width="2"/>
    <text x="120" y="148" font-family="serif" font-size="120" font-weight="900" fill="#006d77" text-anchor="middle" letter-spacing="-5">厚</text>
  </g>

  <!-- 主标题 -->
  <text x="450" y="220" font-family="serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="20">厚 生</text>
  <text x="450" y="340" font-family="sans-serif" font-size="48" font-weight="500" fill="#f77f00" letter-spacing="14">HOUSHENG · WELLNESS</text>

  <!-- 副标题 / 服务 -->
  <text x="460" y="400" font-family="serif" font-size="22" fill="#b0d4d0" letter-spacing="6">营养 · 功法 · 理疗 · 心理 · 检测 · 慢病</text>
</svg>

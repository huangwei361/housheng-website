<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006d77"/>
      <stop offset="100%" stop-color="#004f57"/>
    </linearGradient>
    <linearGradient id="leftLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffddd2"/>
    </linearGradient>
    <linearGradient id="rightLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffddd2"/>
      <stop offset="100%" stop-color="#e29578"/>
    </linearGradient>
  </defs>
  <!-- 圆底 -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#markBg)"/>
  <!-- 左叶 -->
  <path d="M 32 14
           C 22 18, 15 24, 15 32
           C 15 40, 22 46, 32 46
           Z" fill="url(#leftLeaf)"/>
  <!-- 右叶 -->
  <path d="M 32 14
           C 42 18, 49 24, 49 32
           C 49 40, 42 46, 32 46
           Z" fill="url(#rightLeaf)"/>
  <!-- 中心点 -->
  <circle cx="32" cy="30" r="3" fill="#ffddd2"/>
  <circle cx="32" cy="30" r="1.5" fill="#006d77"/>
</svg>

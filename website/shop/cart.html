<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>购物车 · 厚生营养商城</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="navMount"></div>

<div class="container">
  <div class="breadcrumb">
    <a href="index.html">首页</a><span class="sep">/</span>
    <span class="current">购物车</span>
  </div>
</div>

<div class="container" style="margin:14px 0">
  <h1 style="font-size:22px;margin-bottom:14px">🛒 我的购物车 <span id="cartCount" style="font-size:14px;color:var(--gray);font-weight:400"></span></h1>

  <div style="background:linear-gradient(135deg,var(--primary-pale),#fff);border-radius:10px;padding:12px 18px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:14px">
    <span>🛡️ 厚生承诺:正品保障 · 7 天无理由 · 顺丰包邮</span>
    <span style="margin-left:auto;display:flex;gap:6px">
      <a href="product.html" class="btn btn-ghost btn-sm">← 继续购物</a>
      <button class="btn btn-ghost btn-sm" onclick="HS.clearCart()">🗑 清空购物车</button>
    </span>
  </div>

  <!-- 步骤条 -->
  <div style="display:flex;align-items:center;justify-content:center;gap:30px;padding:20px;background:#fff;border-radius:10px;margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:8px;color:var(--primary);font-weight:600">
      <span style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center">1</span> 我的购物车
    </div>
    <span style="color:var(--gray-light)">————</span>
    <div style="display:flex;align-items:center;gap:8px;color:var(--gray)">
      <span style="width:28px;height:28px;border-radius:50%;background:var(--border);color:var(--gray);display:flex;align-items:center;justify-content:center">2</span> 填写订单
    </div>
    <span style="color:var(--gray-light)">————</span>
    <div style="display:flex;align-items:center;gap:8px;color:var(--gray)">
      <span style="width:28px;height:28px;border-radius:50%;background:var(--border);color:var(--gray);display:flex;align-items:center;justify-content:center">3</span> 完成支付
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 320px;gap:20px">
    <!-- 左侧：商品列表 -->
    <div>
      <!-- 凑单提示 -->
      <div id="cartPromo" style="background:linear-gradient(135deg,#fff5e6,#fff);border-radius:10px;padding:14px 18px;margin-bottom:14px;border:1px dashed var(--accent);display:flex;align-items:center;gap:10px;font-size:13px">
      </div>

      <div id="cartList" style="background:#fff;border-radius:10px;overflow:hidden"></div>

      <!-- 推荐搭配 -->
      <section style="background:#fff;border-radius:10px;padding:20px;margin-top:14px">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:14px">💡 经常一起购买</h3>
        <div class="product-grid-3" id="recoGrid"></div>
      </section>
    </div>

    <!-- 右侧：结算栏 -->
    <aside style="position:sticky;top:80px;height:fit-content">
      <div style="background:#fff;border-radius:10px;padding:20px;margin-bottom:14px">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:14px">订单汇总</h3>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px"><span>商品小计</span><span id="sumSub">¥0</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px"><span>运费</span><span id="sumShip">¥0</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px"><span>优惠</span><span id="sumCoupon" style="color:var(--red)">-¥0</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px"><span>税费</span><span>¥0.00</span></div>
        <div style="border-top:1px solid var(--border);margin:14px 0;padding-top:14px;display:flex;justify-content:space-between;align-items:baseline">
          <span>应付</span>
          <span class="price-now" id="sumTotal" style="font-size:28px">¥0</span>
        </div>
        <button class="btn btn-primary btn-block btn-lg" onclick="HS.checkout()">去结算 (<span id="btnCount">0</span>)</button>
        <p style="font-size:11px;color:var(--gray);text-align:center;margin-top:10px">支持微信 / 支付宝 / 银联</p>
      </div>

      <!-- 优惠券 -->
      <div style="background:#fff;border-radius:10px;padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h3 style="font-size:15px;font-weight:700">🎁 优惠券</h3>
          <a href="#" onclick="HS.Modal.open('couponCenterModal');return false" style="font-size:12px;color:var(--primary)">领券 →</a>
        </div>
        <div id="couponList"></div>
      </div>
    </aside>
  </div>
</div>

<div id="footerMount"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
const esc = s => String(s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selectedCoupon = null;

function render(){
  const items = HS.Cart.get();
  const list = items.map(i => ({...HS.products.find(p => p.id===i.id), qty:i.qty, ci:i.id})).filter(Boolean);
  document.getElementById("cartCount").textContent = items.reduce((s,i)=>s+i.qty,0) ? `(共 ${items.reduce((s,i)=>s+i.qty,0)} 件)` : "";

  if(list.length === 0){
    document.getElementById("cartList").innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--gray)">
        <div style="font-size:60px;margin-bottom:14px">🛒</div>
        <p style="margin-bottom:14px">购物车空空如也</p>
        <a href="product.html" class="btn btn-primary">去逛逛</a>
      </div>
    `;
    document.getElementById("recoGrid").innerHTML = "";
    document.querySelector("aside").style.display = "none";
    return;
  }
  document.querySelector("aside").style.display = "block";

  // 列表
  document.getElementById("cartList").innerHTML = `
    <div style="padding:14px 18px;background:var(--bg);display:flex;align-items:center;gap:14px;font-size:13px">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="checkAll" onchange="HS.checkAll(this.checked)" ${items.length?"checked":""}/> 全选
      </label>
      <span style="color:var(--gray)">商品信息</span>
      <span style="color:var(--gray);margin-left:auto">共 <strong>${items.length}</strong> 种 ${items.reduce((s,i)=>s+i.qty,0)} 件</span>
    </div>
    ${list.map(it => `
      <div style="display:flex;align-items:center;gap:14px;padding:18px;border-top:1px solid var(--border)" data-id="${it.ci}">
        <input type="checkbox" class="cart-check" checked onchange="HS.recalc()"/>
        <a href="detail.html?id=${it.id}"><img src="${it.img}" style="width:80px;height:80px;object-fit:contain;background:var(--bg);border-radius:6px"/></a>
        <div style="flex:1;min-width:0">
          <a href="detail.html?id=${it.id}" style="font-size:14px;font-weight:600">${esc(it.name)}</a>
          <div style="font-size:12px;color:var(--gray);margin-top:4px">${esc(it.spec)}</div>
          <div style="display:flex;gap:8px;margin-top:6px">
            <span class="product-tag">${esc(it.tags[0]||"")}</span>
            ${it.was > it.price ? `<span style="font-size:11px;color:var(--red)">直降 ${HS.money(it.was-it.price)}</span>` : ""}
          </div>
        </div>
        <div style="width:120px">
          <div class="qty-stepper" style="width:fit-content">
            <button onclick="HS.changeQty('${it.ci}', -1)">−</button>
            <input type="number" value="${it.qty}" min="1" max="${it.stock}" onchange="HS.setQty('${it.ci}', this.value)" onclick="this.select()"/>
            <button onclick="HS.changeQty('${it.ci}', 1)">+</button>
          </div>
        </div>
        <div style="width:100px;text-align:right">
          <div class="price-now line-total">${HS.money(it.price*it.qty)}</div>
          ${it.was > it.price ? `<div class="price-was line-total-was" style="font-size:11px">${HS.money(it.was*it.qty)}</div>` : ""}
        </div>
        <div style="width:60px;text-align:right">
          <button class="btn btn-ghost btn-sm" onclick="HS.remove('${it.ci}')">删除</button>
        </div>
      </div>
    `).join("")}
  `;

  // 推荐
  const recoIds = list.map(l => l.id);
  const reco = HS.products.filter(p => !recoIds.includes(p.id)).sort(() => Math.random()-0.5).slice(0, 3);
  document.getElementById("recoGrid").innerHTML = reco.map(p => HS.productCard(p).replace(`<button class="btn btn-primary btn-block"`, `<button class="btn btn-outline btn-block"`).replace(`加入购物车`, `+ 加入购物车`)).join("");

  // 凑单
  const total = HS.Cart.total();
  const nextThreshold = 199;
  if(total < nextThreshold){
    const diff = nextThreshold - total;
    document.getElementById("cartPromo").innerHTML = `
      🎁 再买 <strong style="color:var(--red);font-size:15px">${HS.money(diff)}</strong> 即可享 <strong style="color:var(--red)">顺丰包邮</strong>！
      <a href="product.html" class="btn btn-sm" style="background:var(--accent);color:#fff;margin-left:auto">去凑单 →</a>
    `;
  } else {
    document.getElementById("cartPromo").innerHTML = `🎉 已满 <strong style="color:var(--green)">199 元</strong>，享顺丰包邮！`;
  }

  recalc();
}

function recalc(){
  const items = HS.Cart.get();
  const sub = HS.Cart.total();
  const ship = sub >= 199 ? 0 : 12;
  let couponAmt = 0;
  if(selectedCoupon && sub >= selectedCoupon.threshold){
    couponAmt = selectedCoupon.amount;
  }
  const total = Math.max(0, sub + ship - couponAmt);
  document.getElementById("sumSub").textContent = HS.money(sub);
  document.getElementById("sumShip").textContent = ship === 0 ? "免运费" : HS.money(ship);
  document.getElementById("sumCoupon").textContent = "-" + HS.money(couponAmt);
  document.getElementById("sumTotal").textContent = HS.money(total);
  document.getElementById("btnCount").textContent = items.reduce((s,i)=>s+i.qty,0);

  // 优惠券
  const cs = HS.Coupon.available();
  document.getElementById("couponList").innerHTML = cs.length === 0 ? '<div style="text-align:center;color:var(--gray);font-size:13px;padding:14px">暂无可用券</div>' :
    cs.map(c => `
      <div onclick="HS.pickCoupon('${c.id}')" style="display:flex;align-items:center;gap:8px;padding:10px;border:1.5px solid ${selectedCoupon && selectedCoupon.id===c.id?'var(--primary)':'var(--border)'};border-radius:6px;margin-bottom:8px;cursor:pointer;background:${selectedCoupon && selectedCoupon.id===c.id?'var(--primary-pale)':'#fff'}">
        <div style="background:var(--primary);color:#fff;padding:6px 10px;border-radius:4px;font-weight:700;font-size:13px">¥${c.amount}</div>
        <div style="flex:1;font-size:12px">
          <div style="color:var(--dark)">满${c.threshold}可用</div>
          <div style="color:var(--gray)">${esc(c.scope)}</div>
        </div>
        <span style="font-size:12px;color:${selectedCoupon && selectedCoupon.id===c.id?'var(--primary)':'var(--gray)'}">${selectedCoupon && selectedCoupon.id===c.id?'✓ 已选':'使用'}</span>
      </div>
    `).join("");
}

HS.checkAll = v => {
  document.querySelectorAll(".cart-check").forEach(c => c.checked = v);
  recalc();
};
HS.changeQty = (id, d) => {
  const items = HS.Cart.get();
  const item = items.find(i => i.id===id);
  if(!item) return;
  const v = Math.max(1, Math.min(99, item.qty + d));
  HS.Cart.update(id, v);
  // 实时局部更新:行内小计 + 总计
  updateLineTotal(id);
  recalc();
  HS.Toast.show(`已更新数量为 ${v}`, "success");
};
HS.setQty = (id, v) => {
  v = Math.max(1, Math.min(99, parseInt(v) || 1));
  HS.Cart.update(id, v);
  updateLineTotal(id);
  recalc();
};
HS.remove = id => {
  if(!confirm("确定删除此商品？")) return;
  HS.Cart.remove(id);
  HS.Toast.show("已删除", "success");
  // 实时:移除行 + 重算
  const row = document.querySelector(`[data-id="${id}"]`);
  if(row){
    row.style.transition = "all 0.3s";
    row.style.opacity = "0";
    row.style.transform = "translateX(20px)";
    setTimeout(() => render(), 300);
  } else {
    render();
  }
};
HS.clearCart = () => {
  if(!confirm("确定清空购物车?")) return;
  HS.Cart.clear();
  HS.Toast.show("购物车已清空", "success");
  render();
};
// 局部刷新某一行小计
function updateLineTotal(id){
  const item = HS.Cart.get().find(i => i.id===id);
  if(!item) return;
  const p = HS.products.find(x => x.id===id);
  if(!p) return;
  const row = document.querySelector(`[data-id="${id}"]`);
  if(!row) return;
  const inp = row.querySelector("input[type=number]");
  if(inp) inp.value = item.qty;
  const newTotal = HS.money(p.price * item.qty);
  const priceEl = row.querySelector(".line-total");
  if(priceEl){
    priceEl.style.transition = "color 0.2s";
    priceEl.style.color = "var(--red)";
    priceEl.textContent = newTotal;
    setTimeout(() => priceEl.style.color = "", 200);
  }
  const wasEl = row.querySelector(".line-total-was");
  if(wasEl && p.was > p.price) wasEl.textContent = HS.money(p.was * item.qty);
}
HS.pickCoupon = id => {
  const c = HS.Coupon.available().find(x => x.id===id);
  if(c){
    if(selectedCoupon && selectedCoupon.id===id) selectedCoupon = null;
    else selectedCoupon = c;
  }
  recalc();
};
HS.checkout = () => {
  if(HS.Cart.count() === 0){ HS.Toast.show("购物车是空的", "error"); return; }
  localStorage.setItem("hs_checkout_coupon", JSON.stringify(selectedCoupon));
  location.href = "checkout.html";
};

render();
</script>
</body>
</html>
